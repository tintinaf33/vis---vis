## Configuration fictive : voisin de RTR-NORD-01, construit à partir de groupes Junos (gabarits)
version 21.2R3;
groups {
    GABARIT-OSPF {
        protocols {
            ospf {
                traffic-engineering;
                area <*> {
                    interface <ge-*> {
                        interface-type p2p;
                        authentication {
                            md5 1 key "$9$sq4oGTQntpB8XDHkqTQ9Ctu1RcyleM8IRwY"; ## SECRET-DATA
                        }
                        bfd-liveness-detection {
                            minimum-interval 50;
                            multiplier 3;
                        }
                    }
                }
            }
        }
    }
    GABARIT-RSVP {
        protocols {
            rsvp {
                interface <*> {
                    link-protection;
                }
            }
        }
    }
    GABARIT-MTU {
        interfaces {
            <ge-0/*> {
                mtu 1600;
            }
        }
    }
    GABARIT-VPLS {
        routing-instances {
            <*_VPLS> {
                protocols {
                    vpls {
                        site SUD-02 {
                            site-identifier 102;
                        }
                        no-tunnel-services;
                    }
                }
            }
        }
    }
}
system {
    host-name RTR-SUD-02;
    time-zone UTC;
    radius-server {
        203.0.113.10 {
            secret "secret-radius"; ## SECRET-DATA
            timeout 5;
            source-address 198.51.100.2;
        }
    }
    syslog {
        host 203.0.113.20 {
            any notice;
        }
        source-address 198.51.100.2;
    }
    ntp {
        server 203.0.113.30 prefer;
        server 203.0.113.31;
    }
}
interfaces {
    apply-groups GABARIT-MTU;
    ge-0/0/0 {
        description FO_RTR-SUD-02-RTR-NORD-01;
        unit 0 {
            family inet {
                address 192.0.2.1/31;
            }
            family mpls;
        }
    }
    ge-0/0/1 {
        description FO_RTR-SUD-02-RTR-OUEST-04;
        unit 0 {
            family inet {
                address 192.0.2.4/31;
            }
            family mpls;
        }
    }
    ge-0/0/5 {
        description CLIENT_VIDEO;
        encapsulation ethernet-vpls;
        unit 0 {
            family vpls;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input PROTECTION-RE;
                }
                address 198.51.100.2/32;
            }
        }
    }
}
policy-options {
    prefix-list MGMT {
        203.0.113.0/24;
    }
}
firewall {
    family inet {
        filter PROTECTION-RE {
            term SSH {
                from {
                    source-prefix-list {
                        MGMT;
                    }
                    protocol tcp;
                    port ssh;
                }
                then accept;
            }
            term RESTE {
                then accept;
            }
        }
    }
}
class-of-service {
    classifiers {
        exp LECTURE-EXP {
            forwarding-class best-effort {
                loss-priority low code-points 000;
            }
            forwarding-class network-control {
                loss-priority low code-points 111;
            }
        }
    }
    rewrite-rules {
        exp MARQUAGE-EXP {
            forwarding-class best-effort {
                loss-priority low code-point 000;
            }
            forwarding-class network-control {
                loss-priority low code-point 111;
            }
        }
    }
    scheduler-maps {
        ORDO-STANDARD {
            forwarding-class best-effort scheduler FILE-BE;
            forwarding-class network-control scheduler FILE-NC;
        }
    }
    schedulers {
        FILE-BE {
            transmit-rate percent 90;
        }
        FILE-NC {
            transmit-rate percent 10;
        }
    }
    interfaces {
        ge-0/0/0 {
            scheduler-map ORDO-STANDARD;
            shaping-rate 1g;
            unit 0 {
                classifiers {
                    exp LECTURE-EXP;
                }
                rewrite-rules {
                    exp MARQUAGE-EXP;
                }
            }
        }
    }
}
routing-instances {
    apply-groups GABARIT-VPLS;
    VIDEO_VPLS {
        instance-type vpls;
        interface ge-0/0/5.0;
        route-distinguisher 198.51.100.2:500;
        vrf-target target:64500:500;
    }
}
routing-options {
    router-id 198.51.100.2;
    autonomous-system 64500;
}
protocols {
    bgp {
        group IBGP {
            type internal;
            local-address 198.51.100.2;
            family inet-vpn {
                unicast;
            }
            family l2vpn {
                signaling;
            }
            authentication-key "secret-bgp"; ## SECRET-DATA
            neighbor 198.51.100.1;
        }
    }
    ldp {
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
    }
    mpls {
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
    }
    ospf {
        apply-groups GABARIT-OSPF;
        area 0.0.0.10 {
            nssa;
            interface ge-0/0/0.0 {
                metric 10;
            }
            interface ge-0/0/1.0 {
                metric 10;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
    rsvp {
        apply-groups GABARIT-RSVP;
        interface ge-0/0/0.0 {
            bandwidth 1g;
        }
    }
    lldp {
        interface ge-0/0/0;
    }
}
